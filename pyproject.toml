[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "debugpy-run"
description = "Finds and runs debugpy for VS Code \"remote attach\" command line debugging"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.7"
keywords = ["debugpy", "vscode", "code", "ptvsd"]
dynamic = ["version"]
dependencies = [
  "packaging",
  "debugpy",
  "psutil",
]

[[project.authors]]
name = "Mark Blakeney"
email = "mark.blakeney@bullet-systems.net"

[project.urls]
Homepage = "https://github.com/bulletmark/debugpy-run"

[project.scripts]
debugpy-run = "debugpy_run:main"

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["SIM115", "SIM905", "BLE001", "PLW1510", "DTZ"]

